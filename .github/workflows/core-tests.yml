name: Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test configuration, routing and integration ownership
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Rebuild vector brand exports
        shell: pwsh
        run: ./scripts/Build-Brand.ps1
      - name: Validate transparent native icon frames
        shell: pwsh
        run: ./scripts/Test-Brand.ps1
